services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pipeline:
    build: .
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=weather_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./assets:/app/assets

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=weather_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
    ports:
      - "8501:8501"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
